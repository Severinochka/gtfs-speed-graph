[project]
name = "infra-access"
version = "0.1.0"
description = "Library for assessing social infrastructure accessibility for residential buildings"
authors = [
    {name = "Severinochka",email = "khorzovaseverina@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "geopandas (>=1.1.4,<2.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry]
packages = [{include = "infra_access", from = "src"}]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
